networks:
  bridge:
    driver: bridge
services:
  web:
    image: nexus.sadgan.int/xwiki:18.8.0-postgres-tomcat-202610271445
    #image: nexus.sadgan.int/xwiki:18.8.0-postgres-tomcat-202610271039
    container_name: xwiki-postgres-tomcat-web
    init: true
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - XWIKI_VERSION=18.8.0
      - DB_USER=xwiki
      - DB_PASSWORD=xwiki
      - DB_DATABASE=xwiki
      - DB_HOST=xwiki-postgres-db
    volumes:
      - xwiki-data:/usr/local/xwiki
    networks:
      - bridge
  db:
    image: postgres:latest
    container_name: xwiki-postgres-db
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=xwiki
      - POSTGRES_USER=xwiki
      - POSTGRES_DB=xwiki
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
    networks:
      - bridge
    ports:
      - "5433:5432"
volumes:
  postgres-data: {}
  xwiki-data: {}
