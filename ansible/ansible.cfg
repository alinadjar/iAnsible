[defaults]
# Single inventory file — verify on the control node:
#   ansible-config dump | grep INVENTORY
# Do NOT set inventory = inventory/production (directory loads vault.yml as hosts).
inventory = inventory/production/hosts.yml
inventory_ignore_extensions = .example, .sample, .md, .cfg, .ini, .dist
roles_path = roles
collections_paths = collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
interpreter_python = auto_silent
deprecation_warnings = False

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
