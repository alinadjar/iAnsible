---
# License instance.lock — after fingerprint-agent systemd (LOCAL_FG_AGENT = erp_getlock_local_fg_agent).
- name: Detect node IP when fingerprint agent step was skipped
  vars:
    _fg_agent_override: "{{ erp_getlock_local_fg_agent | default('') }}"
    _erp_ip_override: "{{ erp_node_ip | default('') }}"
  ansible.builtin.set_fact:
    erp_node_ip: >-
      {{
        _erp_ip_override | trim
        if (_erp_ip_override | trim | length) > 0
        else (
          ansible_default_ipv4.address | default(ansible_host) | trim
        )
      }}
    erp_getlock_local_fg_agent: >-
      {{
        _fg_agent_override | trim | regex_replace('/$', '')
        if (_fg_agent_override | trim | length) > 0
        else (
          'http://' ~ (
            _erp_ip_override | trim
            if (_erp_ip_override | trim | length) > 0
            else (ansible_default_ipv4.address | default(ansible_host) | trim)
          ) ~ ':' ~ (erp_agent_port_fingerprint | string)
        )
      }}
  when: (_fg_agent_override | trim | length) == 0

- name: Ensure ERP metadata directory exists
  ansible.builtin.file:
    path: "{{ erp_deploy_path }}/metadata"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Ensure getLock.sh is executable
  ansible.builtin.file:
    path: "{{ erp_deploy_path }}/getLock.sh"
    mode: "0755"

- name: Request instance lock from license API
  ansible.builtin.command:
    argv:
      - ./getLock.sh
      - "{{ erp_lock_instance_id }}"
    chdir: "{{ erp_deploy_path }}"
  environment:
    LOCAL_FG_AGENT: "{{ erp_getlock_local_fg_agent }}"
    API_URL: "{{ erp_getlock_api_url }}"
    LICENSE_LOCK: "{{ erp_deploy_path }}/instance.lock"
  become_user: "{{ deploy_user }}"
  register: erp_getlock_result
  changed_when: true

- name: Install instance.lock under metadata
  ansible.builtin.copy:
    src: "{{ erp_deploy_path }}/instance.lock"
    dest: "{{ erp_deploy_path }}/metadata/instance.lock"
    remote_src: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Remove temporary instance.lock from deploy root
  ansible.builtin.file:
    path: "{{ erp_deploy_path }}/instance.lock"
    state: absent
