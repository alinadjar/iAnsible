---
erp_enabled: true
erp_env_file: .env

erp_deploy_path: /opt/sadgan/erp
erp_stack_subpath: erp
erp_compose_file: compose.yaml
erp_compose_project_name: fx_alpha
erp_env_template: erp.env.j2

erp_registry_url: "{{ platform_registry_url | default('registry.sadgan.int') }}"
# Compose `.env`: `$$` becomes `$` in REGISTRY_USER
erp_registry_user: "robot$$fx+sidecar-readonly"
erp_registry_tls_skip_verify: "true"
erp_sidecar_version: v1.4.7
# Sidecar bind mount target inside the container (must match compose `:${DEPLOY_PATH}`)
erp_sidecar_deploy_path: "{{ erp_deploy_path }}"
erp_backup_retention_days: 7
erp_backup_retention_count: 10
erp_nginx_container_port_front: 8001
erp_nginx_container_port_back: 8000
erp_nginx_config_template: nginx.conf.j2
erp_nginx_ssl_cert_dir: /etc/nginx/certs
erp_version: v1.20.0
erp_license_server: https://api-license-alpha.sadgan.com

erp_nginx_port_front: 8080
erp_nginx_port_back: 8000
erp_public_url_scheme: https
erp_use_platform_integration_urls: false
erp_replica_port_lb: 5401
erp_instance_id: ERP01

erp_project_code: fx

# SadganFingerprintAgent (systemd on host — before getLock / compose pull)
erp_fingerprint_agent_enabled: true
erp_fingerprint_agent_download_url: https://get.sadgan.com/SadganFingerprintAgent
erp_fingerprint_agent_download_via_controller: true
erp_fingerprint_agent_cache_dir: "{{ playbook_dir }}/../.cache/fingerprint-agent"
erp_fingerprint_agent_download_timeout: 300
erp_fingerprint_agent_download_retries: 3
erp_fingerprint_agent_download_retry_delay: 10
erp_fingerprint_agent_download_force: false
erp_fingerprint_agent_download_validate_certs: true
erp_fingerprint_install_path: /opt/sadgan/fingerprint-agent
erp_fingerprint_health_retries: 15
erp_fingerprint_health_delay: 2
erp_agent_port_fingerprint: 4000

# getLock.sh / instance.lock (before compose pull)
erp_instance_lock_enabled: true
erp_instance_lock_prompt: true
# Base URL for fingerprint agent (no trailing slash). Omitted here — empty string breaks default().
# Auto-set in fingerprint-agent.yml as http://<node-ip>:<erp_agent_port_fingerprint> unless overridden in group_vars.
# erp_getlock_local_fg_agent: "http://192.168.10.159:4000"
erp_getlock_api_url: "{{ erp_license_server }}/api/licensemanagement/instanceLock"

# Self-signed TLS under config/certs (nginx) — generated on target after sync
erp_ssl_self_signed_enabled: true
erp_ssl_cert_dir: config/certs
erp_ssl_cert_file: server.crt
erp_ssl_key_file: server.key
erp_ssl_cert_path: "{{ erp_ssl_cert_dir }}/{{ erp_ssl_cert_file }}"
erp_ssl_key_path: "{{ erp_ssl_cert_dir }}/{{ erp_ssl_key_file }}"
erp_ssl_cert_cn: "{{ hostvars[inventory_hostname].ansible_host }}"
erp_ssl_days: 825
erp_ssl_key_bits: 2048
erp_ssl_regenerate: false
erp_stack_rsync_opts:
  - "--exclude=.env"
  - "--exclude=config/certs/"
  - "--exclude=config/nginx.conf"
  - "--exclude=config/appsettings.front.json"

erp_external_networks:
  - net_fx_alpha
  - redis_insight

erp_external_volumes:
  - pg-csv-exports-demo

# Used when group_vars/all.yml platform_integration is missing (fix all.yml on control node).
platform_integration:
  erp_public_api_url: https://localhost:8000
  erp_public_app_url: https://localhost
