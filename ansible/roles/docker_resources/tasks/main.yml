---
- name: Create external Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ docker_external_networks | default([]) }}"

- name: Create external Docker volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop: "{{ docker_external_volumes | default([]) }}"
