---
- name: Ensure deploy group exists
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present

- name: Ensure deploy user exists
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    groups: docker
    append: true
    create_home: true
    shell: /bin/bash
    state: present

- name: Check whether Docker CLI is available
  ansible.builtin.command: docker --version
  register: common_docker_version_check
  changed_when: false
  failed_when: false
  when: common_install_docker != 'never'

- name: Check whether Docker Compose plugin is available
  ansible.builtin.command: docker compose version
  register: common_compose_version_check
  changed_when: false
  failed_when: false
  when: common_install_docker != 'never'

- name: Set Docker installation facts
  ansible.builtin.set_fact:
    common_docker_present: "{{ common_docker_version_check.rc | default(1) == 0 }}"
    common_compose_present: "{{ common_compose_version_check.rc | default(1) == 0 }}"
  when: common_install_docker != 'never'

- name: Decide whether to run Docker CE installation
  ansible.builtin.set_fact:
    common_run_docker_install: >-
      {{
        common_install_docker == 'always'
        or (
          common_install_docker == 'auto'
          and (
            not common_docker_present | default(false)
            or not common_compose_present | default(false)
          )
        )
      }}
  when: common_install_docker != 'never'

- name: Install Docker Engine and Compose plugin (Debian family)
  when:
    - ansible_os_family == "Debian"
    - common_install_docker != 'never'
    - common_run_docker_install | default(true)
  block:
    - name: Install Docker prerequisites (Debian family)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
        state: present
        update_cache: true

    - name: Add Docker apt key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: "{{ docker_packages_state }}"

- name: Log when Docker install is skipped
  ansible.builtin.debug:
    msg: >-
      Skipping Docker CE install: docker present={{ common_docker_present | default(false) }},
      compose plugin present={{ common_compose_present | default(false) }}.
    verbosity: 1
  when:
    - common_install_docker == 'auto'
    - not (common_run_docker_install | default(true))

- name: Configure Docker daemon (insecure registries, logging)
  when:
    - common_configure_docker_daemon
    - common_install_docker == 'never'
      or common_docker_present | default(false)
      or common_run_docker_install | default(false)
  block:
    - name: Ensure Docker config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Merge registry settings into Docker daemon.json
      ansible.builtin.import_tasks: docker-daemon.yml

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - common_ensure_docker_service
    - common_install_docker == 'never'
      or common_docker_present | default(false)
      or common_run_docker_install | default(false)

- name: Apply Docker daemon restart if daemon.json changed
  ansible.builtin.meta: flush_handlers
  when:
    - common_configure_docker_daemon
    - common_ensure_docker_service
    - common_install_docker == 'never'
      or common_docker_present | default(false)
      or common_run_docker_install | default(false)

- name: Verify Docker daemon is healthy
  ansible.builtin.command: docker info
  register: common_docker_info
  changed_when: false
  retries: "{{ common_docker_health_retries }}"
  delay: "{{ common_docker_health_delay }}"
  until: common_docker_info.rc == 0
  when:
    - common_ensure_docker_service
    - common_install_docker == 'never'
      or common_docker_present | default(false)
      or common_run_docker_install | default(false)

