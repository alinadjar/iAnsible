---
- name: Sync Superset stack files
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ superset_deploy_path }}"
    stack_subpath: "{{ superset_stack_subpath }}"
    stack_compose_project_name: "{{ superset_compose_project_name }}"
    stack_compose_files:
      - "{{ superset_compose_file }}"
    stack_skip_sync: false
    stack_skip_compose: true

- name: Find shell scripts under Superset docker/
  ansible.builtin.find:
    paths: "{{ superset_deploy_path }}/docker"
    patterns: "*.sh"
    recurse: true
    file_type: file
  register: superset_docker_shell_scripts
  when: superset_ensure_docker_scripts_executable | default(true)

- name: Ensure Superset docker shell scripts are executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
  loop: "{{ superset_docker_shell_scripts.files }}"
  when:
    - superset_ensure_docker_scripts_executable | default(true)
    - superset_docker_shell_scripts.matched | default(0) > 0

- name: Render Superset compose environment file (project root, beside docker/)
  ansible.builtin.template:
    src: "{{ superset_compose_env_template }}"
    dest: "{{ superset_deploy_path }}/{{ superset_compose_env_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Ensure Superset docker env directory exists
  ansible.builtin.file:
    path: "{{ superset_deploy_path }}/docker"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Render Superset docker environment file
  ansible.builtin.template:
    src: "{{ superset_env_template }}"
    dest: "{{ superset_deploy_path }}/docker/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  no_log: true

- name: Apply Superset Docker Compose stack
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ superset_deploy_path }}"
    stack_subpath: "{{ superset_stack_subpath }}"
    stack_compose_project_name: "{{ superset_compose_project_name }}"
    stack_compose_files:
      - "{{ superset_compose_file }}"
    stack_skip_sync: true
    stack_skip_compose: false
    stack_compose_pull_images: false
    stack_env_guard: true
    stack_require_env_file: docker/.env
