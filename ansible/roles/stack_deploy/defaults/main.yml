---
# Defaults when group_vars/all.yml is missing or incomplete on the control node.
stack_source: local
stack_git_url: ""
stack_git_version: main
repo_root: "{{ playbook_dir }}/../.."

stack_rsync_opts: []
# rsync by checksum avoids "changed" when only mtime differs (default: true).
stack_sync_use_checksum: true
# Prefer explicit flags on each include_role call — do not rely on these defaults in app roles.
stack_skip_sync: false
stack_skip_compose: true
stack_env_guard: false
stack_compose_pull_images: true
stack_compose_recreate: auto
...
