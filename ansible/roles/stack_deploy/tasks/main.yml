---
- name: Ensure stack deploy parent directory exists
  ansible.builtin.file:
    path: "{{ stack_deploy_path | dirname }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  when:
    - not (stack_skip_sync | default(false))
    - (stack_deploy_path | dirname) != stack_deploy_path

- name: Stat stack deploy directory
  ansible.builtin.stat:
    path: "{{ stack_deploy_path }}"
  register: stack_deploy_dir_stat
  when: not (stack_skip_sync | default(false))

- name: Ensure stack deploy directory exists
  ansible.builtin.file:
    path: "{{ stack_deploy_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  when:
    - not (stack_skip_sync | default(false))
    - not (
        stack_deploy_dir_stat.stat.exists | default(false)
        and (stack_deploy_dir_stat.stat.isdir | default(false))
        and stack_deploy_dir_stat.stat.pw_name | default('') == deploy_user
        and stack_deploy_dir_stat.stat.gr_name | default('') == deploy_group
      )

- name: Clone or update monorepo on target (git source)
  ansible.builtin.git:
    repo: "{{ stack_git_url }}"
    dest: "{{ stack_git_dest | default(stack_deploy_path + '/repo') }}"
    version: "{{ stack_git_version }}"
    force: false
    update: true
  become_user: "{{ deploy_user }}"
  when:
    - stack_source | default('local') == 'git'
    - not (stack_skip_sync | default(false))

- name: Set stack content path for git source
  ansible.builtin.set_fact:
    stack_content_src: "{{ stack_git_dest | default(stack_deploy_path + '/repo') }}/{{ stack_subpath }}"
  when:
    - stack_source | default('local') == 'git'
    - not (stack_skip_sync | default(false))

- name: Copy stack from cloned monorepo (git source)
  ansible.builtin.copy:
    src: "{{ stack_content_src }}/"
    dest: "{{ stack_deploy_path }}/"
    remote_src: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: preserve
  when:
    - stack_source | default('local') == 'git'
    - not (stack_skip_sync | default(false))

- name: Set stack content path for local source
  ansible.builtin.set_fact:
    stack_content_src: "{{ repo_root | default(playbook_dir + '/../..') }}/{{ stack_subpath }}"
  when: stack_source | default('local') == 'local'

- name: Sync stack files to deploy path (local source)
  ansible.posix.synchronize:
    src: "{{ stack_content_src }}/"
    dest: "{{ deploy_user }}@{{ hostvars[inventory_hostname].ansible_host }}:{{ stack_deploy_path }}/"
    delete: true
    checksum: "{{ stack_sync_use_checksum | default(true) }}"
    rsync_opts: "{{ stack_rsync_opts | default([]) + ['--exclude=.env', '--exclude=docker/.env', '--exclude=.git', '--exclude=venv', '--exclude=venv-313', '--exclude=node_modules'] }}"
  delegate_to: localhost
  when:
    - stack_source | default('local') == 'local'
    - not (stack_skip_sync | default(false))

- name: Refuse sync+compose in one pass when env must be templated first
  ansible.builtin.fail:
    msg: >-
      stack_deploy was called with stack_skip_sync=false and stack_skip_compose=false.
      Compose ran before .env exists. Use the erp/dify/superset role pattern: sync (skip_compose=true),
      template env, compose (skip_sync=true, stack_env_guard=true).
  when:
    - not (stack_skip_sync | default(false))
    - not (stack_skip_compose | default(false))
    - stack_env_guard | default(false)

- name: Ensure required env file exists before Docker Compose
  when:
    - not (stack_skip_compose | default(false))
    - stack_env_guard | default(false)
  block:
    - name: Resolve required env files for compose guard
      ansible.builtin.set_fact:
        stack_required_env_file_list: >-
          {{
            stack_require_env_files
            | default([stack_require_env_file | default('.env')])
          }}

    - name: Stat required env files before compose
      ansible.builtin.stat:
        path: "{{ stack_deploy_path }}/{{ item }}"
      loop: "{{ stack_required_env_file_list }}"
      register: stack_env_files_stat

    - name: Fail when a required env file is missing before Docker Compose
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is missing under {{ stack_deploy_path }}.
          Render env templates in the app role, then run compose with stack_skip_sync=true.
      loop: "{{ stack_env_files_stat.results }}"
      when: not item.stat.exists

- name: Verify Compose files exist in project directory
  ansible.builtin.stat:
    path: "{{ stack_deploy_path }}/{{ item }}"
  loop: "{{ stack_compose_files }}"
  register: stack_compose_file_checks
  when: not (stack_skip_compose | default(false))

- name: Fail when Compose file is missing in project directory
  ansible.builtin.fail:
    msg: >-
      Missing {{ stack_deploy_path }}/{{ item.item }} (sync source: {{ stack_subpath | default('?') }}).
      Confirm stack_deploy_path is the compose project root (for Dify: .../dify/docker).
  loop: "{{ stack_compose_file_checks.results | default([]) }}"
  when:
    - not (stack_skip_compose | default(false))
    - not item.stat.exists | default(false)

- name: Pull container images
  community.docker.docker_compose_v2:
    project_src: "{{ stack_deploy_path }}"
    project_name: "{{ stack_compose_project_name }}"
    files: "{{ stack_compose_files }}"
    env_files: "{{ stack_compose_env_files | default(omit) }}"
    pull: always
    state: present
  become_user: "{{ deploy_user }}"
  register: stack_compose_pull
  when:
    - not (stack_skip_compose | default(false))
    - stack_compose_pull_images | default(true)

- name: Apply Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ stack_deploy_path }}"
    project_name: "{{ stack_compose_project_name }}"
    files: "{{ stack_compose_files }}"
    env_files: "{{ stack_compose_env_files | default(omit) }}"
    state: present
    recreate: "{{ stack_compose_recreate | default('auto') }}"
    remove_orphans: true
  become_user: "{{ deploy_user }}"
  register: stack_compose_up
  when: not (stack_skip_compose | default(false))

