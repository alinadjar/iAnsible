---
- name: Sync Dify stack files
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ dify_deploy_path }}"
    stack_subpath: "{{ dify_stack_subpath }}"
    stack_compose_project_name: "{{ dify_compose_project_name }}"
    stack_compose_files: "{{ dify_compose_files }}"
    stack_skip_sync: false
    stack_skip_compose: true
    stack_rsync_opts: "{{ dify_stack_rsync_opts | default([]) }}"

- name: Render Dify environment file
  ansible.builtin.template:
    src: "{{ dify_env_template }}"
    dest: "{{ dify_deploy_path }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  no_log: true

- name: Render Dify build image tag environment file
  ansible.builtin.template:
    src: "{{ dify_build_tag_env_template }}"
    dest: "{{ dify_deploy_path }}/{{ dify_build_tag_env_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Ensure Dify env directory exists
  ansible.builtin.file:
    path: "{{ dify_deploy_path }}/envs/core-services"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Render Dify Sadgan overlay env
  ansible.builtin.template:
    src: dify-overlay.env.j2
    dest: "{{ dify_deploy_path }}/envs/core-services/shared.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Apply Dify Docker Compose stack
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ dify_deploy_path }}"
    stack_subpath: "{{ dify_stack_subpath }}"
    stack_compose_project_name: "{{ dify_compose_project_name }}"
    stack_compose_files: "{{ dify_compose_files }}"
    stack_compose_env_files: "{{ dify_compose_env_files }}"
    stack_skip_sync: true
    stack_skip_compose: false
    stack_env_guard: true
    stack_require_env_files: "{{ dify_compose_env_files }}"
    stack_rsync_opts: "{{ dify_stack_rsync_opts | default([]) }}"
