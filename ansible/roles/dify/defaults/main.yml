---
dify_enabled: true
dify_deploy_path: /opt/sadgan/dify/docker
dify_stack_subpath: dify/docker
dify_compose_project_name: dify
dify_env_template: dify.env.j2
# Base .env on the control node (synced monorepo); fallback: roles/dify/files/dify.env.j2.base
dify_env_repo_path: "{{ repo_root | default(playbook_dir ~ '/../..') }}/dify/docker/.env"
dify_env_use_platform_urls: false
# INIT_PASSWORD: off by default — follows monorepo docker/.env (use # INIT_PASSWORD= to disable setup password)
# Set true only with vault_dify_init_password to force-inject from vault
dify_env_inject_init_password: false
# Host IP for replacing localhost/127.0.0.1 in docker/.env (defaults to target ansible_host)
# dify_node_ip: 192.168.10.159
# Port paired with 127.0.0.1 in monorepo dify/docker/.env (e.g. :8080 on CONSOLE_* URLs)
dify_env_loopback_nginx_port: 8080
# Published nginx HTTP port on the host (EXPOSE_NGINX_PORT and replacement for 127.0.0.1:<loopback port>)
dify_expose_nginx_port: 8081
# dify_openai_api_base: "http://192.168.10.209:8787/v1"
# dify_ssrf_allow_private_ips: "127.0.0.1"
dify_build_tag_env_template: dify-build-tag.env.j2
dify_build_tag_env_file: .build-tag.env

dify_compose_files:
  - compose.yaml
  - compose.custom.yaml

dify_compose_env_files:
  - .env
  - .build-tag.env

dify_api_image: registry.sadgan.com/oss/dify_api
dify_web_image: registry.sadgan.com/oss/dify_web
dify_api_image_tag: ea872d64c48e
dify_web_image_tag: "20260917"

dify_stack_rsync_opts:
  - "--exclude=.env"
  - "--exclude=.build-tag.env"

# Sandbox code-execution config (mounted at volumes/sandbox/conf/config.yaml)
dify_sandbox_conf_src_path: "{{ repo_root | default(playbook_dir ~ '/../..') }}/dify/docker/volumes/sandbox/conf/config.yaml"
