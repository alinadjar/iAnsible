---
- name: Sync Langfuse stack files
  when: langfuse_enabled
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ langfuse_deploy_path }}"
    stack_subpath: "{{ langfuse_stack_subpath }}"
    stack_compose_project_name: "{{ langfuse_compose_project_name }}"
    stack_compose_files:
      - "{{ langfuse_compose_file }}"
    stack_skip_sync: false
    stack_skip_compose: true

- name: Install Langfuse compose file from upstream origin
  ansible.builtin.copy:
    src: "{{ langfuse_deploy_path }}/{{ langfuse_compose_origin_file }}"
    dest: "{{ langfuse_deploy_path }}/{{ langfuse_compose_file }}"
    remote_src: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  when:
    - langfuse_enabled
    - langfuse_compose_origin_file | length > 0

- name: Prepare Langfuse .env rendering facts
  when: langfuse_enabled
  ansible.builtin.import_tasks: render-env.yml

- name: Render Langfuse environment file
  when: langfuse_enabled
  ansible.builtin.template:
    src: "{{ langfuse_env_template }}"
    dest: "{{ langfuse_deploy_path }}/{{ langfuse_env_file | default('.env') }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  no_log: true

- name: Render Langfuse compose image override
  when:
    - langfuse_enabled
    - langfuse_compose_use_image_override | default(true) | bool
  ansible.builtin.template:
    src: "{{ langfuse_compose_override_images_template }}"
    dest: "{{ langfuse_deploy_path }}/{{ langfuse_compose_override_images_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Apply Langfuse Docker Compose stack
  when: langfuse_enabled
  ansible.builtin.include_role:
    name: stack_deploy
  vars:
    stack_deploy_path: "{{ langfuse_deploy_path }}"
    stack_subpath: "{{ langfuse_stack_subpath }}"
    stack_compose_project_name: "{{ langfuse_compose_project_name }}"
    stack_compose_files: >-
      {{
        langfuse_compose_files
        if (langfuse_compose_use_image_override | default(true) | bool)
        else [langfuse_compose_file]
      }}
    stack_compose_env_files:
      - "{{ langfuse_env_file | default('.env') }}"
    stack_skip_sync: true
    stack_skip_compose: false
    stack_env_guard: true
    stack_require_env_file: .env
