---
langfuse_enabled: false
langfuse_deploy_path: /opt/sadgan/langfuse
langfuse_stack_subpath: langfuse
langfuse_compose_file: compose.yaml
langfuse_compose_project_name: langfuse
langfuse_compose_origin_file: ""
langfuse_compose_override_images_template: compose.override.images.yml.j2
langfuse_compose_override_images_file: compose.override.images.yml
langfuse_compose_use_image_override: true
langfuse_compose_files:
  - "{{ langfuse_compose_file }}"
  - "{{ langfuse_compose_override_images_file }}"
langfuse_env_template: langfuse.env.j2
langfuse_env_file: .env
# Same registry host as ERP (`platform_registry_url` / `erp_registry_url` in group_vars).
langfuse_registry_url: "{{ platform_registry_url | default(erp_registry_url | default('registry.sadgan.int')) }}"
langfuse_env_repo_path: "{{ repo_root | default(playbook_dir ~ '/../..') }}/langfuse/.env"
# true: monorepo langfuse/.env on the control node wins when present; else roles/langfuse/files/langfuse.env.j2.base
langfuse_env_use_monorepo_base: true
langfuse_web_host_port: 3000
langfuse_minio_api_port: 9090
# Replace dev/stale LAN IPs and loopback in host-published URLs (Minio, NEXTAUTH, etc.)
langfuse_env_loopback_host: 127.0.0.1
langfuse_env_replace_loopback_host: true
langfuse_env_stale_node_ips:
  - 192.168.10.209

# Full image refs for compose.yaml (${LANGFUSE_COMPOSE_IMAGE_*}). Adjust tags to match registry.sadgan.int.
_langfuse_registry: "{{ langfuse_registry_url | default(platform_registry_url | default('registry.sadgan.int')) }}"
langfuse_image_worker: "{{ _langfuse_registry }}/oss/langfuse-worker:{{ langfuse_app_image_tag | default('4') }}"
langfuse_image_web: "{{ _langfuse_registry }}/oss/langfuse:{{ langfuse_app_image_tag | default('4') }}"
langfuse_clickhouse_image_repo: common/clickhouse-server
langfuse_clickhouse_image_tag: "25.12.2"
langfuse_image_clickhouse: "{{ _langfuse_registry }}/{{ langfuse_clickhouse_image_repo }}:{{ langfuse_clickhouse_image_tag }}"
langfuse_image_minio: "{{ _langfuse_registry }}/common/minio:{{ langfuse_minio_image_tag | default('latest') }}"
langfuse_image_redis: "{{ _langfuse_registry }}/common/redis:{{ langfuse_redis_image_tag | default('7.2') }}"
langfuse_postgres_image_tag: "{{ langfuse_postgres_version | default('18.0') }}"
langfuse_postgres_version: "18.0"
langfuse_image_postgres: "{{ _langfuse_registry }}/common/postgres:{{ langfuse_postgres_image_tag }}"
