---
dify_enabled: true
platform_vault_required_vars:
  - vault_dify_secret_key
  - vault_dify_db_password
# Compose project root (repo path dify/docker — not the parent dify/ tree)
dify_deploy_path: /opt/sadgan/dify/docker
dify_compose_project_name: dify

dify_stack_subpath: dify/docker

# Equivalent: docker compose --env-file .env --env-file .build-tag.env -f compose.yaml -f compose.custom.yaml
dify_compose_files:
  - compose.yaml
  - compose.custom.yaml
dify_compose_env_files:
  - .env
  - .build-tag.env

dify_api_image: registry.sadgan.com/oss/dify_api
dify_web_image: registry.sadgan.com/oss/dify_web
dify_api_image_tag: ea872d64c48e
dify_web_image_tag: "20260917"

dify_env_use_platform_urls: false
dify_env_inject_init_password: false
# Optional explicit LAN IP; else role uses ansible_default_ipv4 / ansible_host
# dify_node_ip: 192.168.10.159
dify_env_loopback_nginx_port: 8080

# Allow ERP (and other app servers) to reach Dify when Dify runs on another host.
dify_ssrf_allow_private_domains: "{{ groups['erp'] | map('extract', hostvars, 'ansible_host') | list | join(',') }}"
dify_ssrf_allow_private_ips: "127.0.0.1"

# Sadgan deployment overrides (match dify/docker/.env; secrets still come from vault)
dify_openai_api_base: "http://192.168.10.209:8787/v1"
dify_expose_nginx_port: "{{ platform_host_ports.dify_nginx | default(8081) }}"

dify_env_template: dify.env.j2
