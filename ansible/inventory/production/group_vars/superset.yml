---
superset_enabled: true
platform_vault_required_vars:
  - vault_superset_secret_key
superset_deploy_path: /opt/sadgan/superset
superset_compose_project_name: superset

superset_stack_subpath: superset
superset_compose_file: compose.yml
superset_http_port: "{{ platform_host_ports.superset_http | default(8082) }}"

# Rendered to {{ superset_deploy_path }}/.env (beside docker/) for ${TAG} / ${MCPTAG}
superset_tag: 855cf3f
superset_mcptag: f41ee79

# Connect Superset to ERP Postgres BI user (read replica / HAProxy read port).
superset_erp_sqlalchemy_uri: >-
  postgresql+psycopg2://{{ vault_erp_pg_bi_user }}:{{ vault_erp_postgres_bi_password }}@
  {{ erp_pg_bi_host | default(hostvars[groups['erp'] | first]['ansible_host']) }}:
  {{ erp_pg_bi_port | default(5401) }}/{{ vault_erp_postgres_db }}

superset_env_template: superset.env.j2
