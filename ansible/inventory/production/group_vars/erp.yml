---
erp_enabled: true

# Fails deploy-erp if vault did not decrypt (see tasks/validate-platform-secrets.yml).
platform_vault_required_vars:
  - vault_erp_postgres_password
  - vault_erp_postgres_ro_password
  - vault_erp_postgres_bi_password
  - vault_erp_redis_password
  - vault_erp_backup_password
  - vault_erp_registry_password

erp_deploy_path: /opt/sadgan/erp
erp_compose_project_name: fx

# Paths inside the monorepo (relative to repo root).
erp_stack_subpath: erp
erp_compose_file: compose.yaml

# Do NOT set stack_skip_compose: false on the erp role's first stack_deploy (sync) pass.
# Compose must run only after erp.env.j2 is rendered to {{ erp_deploy_path }}/.env.

erp_external_networks:
  - net_fx
  - redis_insight

erp_external_volumes:
  - pg-csv-exports-demo-demo

# Rendered on the server; do not copy erp/.env from the repo (contains secrets).
erp_env_template: erp.env.j2

erp_registry_url: "{{ platform_registry_url }}"
erp_registry_user: "robot$$fx+sidecar-readonly"
erp_sidecar_deploy_path: "{{ erp_deploy_path }}"
erp_sidecar_version: v1.4.7
erp_version: v1.20.0
erp_license_server: https://api-license-alpha.sadgan.com
erp_project_code: fx

erp_fingerprint_agent_download_url: https://get.sadgan.com/SadganFingerprintAgent
# erp_fingerprint_agent_download_via_controller: true

# Self-signed nginx TLS (paths under {{ erp_deploy_path }}/config/certs)
# erp_ssl_cert_cn: erp.demo.sadgan.int
# erp_fingerprint_install_path: /opt/sadgan/fingerprint-agent
# erp_node_ip: 192.168.10.159
# erp_getlock_local_fg_agent: "http://192.168.10.159:4000"

# Optional if group_vars/all.yml does not load (normally use platform_integration there)
# erp_self_url: "https://api.demo.sadgan.int"
# erp_app_url: "https://panel.demo.sadgan.int"

erp_nginx_port_front: "{{ platform_host_ports.erp_nginx_front | default(8080) }}"
erp_nginx_port_back: "{{ platform_host_ports.erp_nginx_back | default(8000) }}"
# erp_node_ip: 192.168.10.159

# Superset / BI read-only access to ERP Postgres (via HAProxy read port on ERP host).
erp_pg_bi_host: "{{ hostvars[groups['erp'] | first]['ansible_host'] }}"
erp_pg_bi_port: 5401

...
