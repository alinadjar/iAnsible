---
# Phase 2 — Langfuse + Headroom (optional hosts in observability group).

platform_vault_required_vars:
  - vault_langfuse_salt
  - vault_langfuse_encryption_key

langfuse_enabled: true
langfuse_deploy_path: /opt/sadgan/langfuse
langfuse_compose_project_name: langfuse
langfuse_stack_subpath: langfuse
langfuse_compose_file: compose.yaml
langfuse_compose_origin_file: ""
langfuse_env_template: langfuse.env.j2
langfuse_registry_url: "{{ platform_registry_url }}"
# Must exist in Harbor — find the tag with: docker pull ... or Harbor UI
langfuse_clickhouse_image_tag: "25.12.2"
# Full ref override (repo/path + tag), e.g. after mirroring clickhouse/clickhouse-server:
# langfuse_image_clickhouse: "registry.sadgan.int/common/clickhouse-server:<tag>"

headroom_enabled: false
headroom_deploy_path: /opt/headroom-ai
# Sync monorepo headroom-ai/; use bundled venv/ when present (no PyPI). Folder name if not "venv":
# headroom_bundled_venv_name: venv
headroom_sync_from_repo: true
headroom_use_bundled_venv: true
# Match an apt Python on the host (python3.12, python3.11, …). venv dir follows: venv-312, venv-311
# headroom_python_version in observability.yml has priority over role defaults. 
# if both set value,  observability wins. If you remove it from observability.yml, the role default (3.12) applies
headroom_python_version: "3.12"
headroom_proxy_host: 0.0.0.0
headroom_proxy_port: 8787
headroom_service_user: root
headroom_service_group: root
# PyPI: obs-01 needs outbound HTTPS or a private index (pypi.org timeouts otherwise).
# headroom_pip_index_url: "https://nexus.example/repository/pypi/simple"
# headroom_pip_trusted_host: "nexus.example"
# Offline: put *.whl under ansible/roles/headroom/files/wheels/ on the control node
# headroom_pip_wheels_src: "{{ playbook_dir }}/../roles/headroom/files/wheels"
headroom_pip_packages:
  - headroom-ai
headroom_service_environment: []
