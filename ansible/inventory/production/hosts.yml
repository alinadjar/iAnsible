---
# Hosts are grouped by stack so each service can run on its own machine.
# Connection defaults: group_vars/all.yml (ansible_user, SSH key).
# Or set ansible_user / ansible_host per host below.

all:
  vars:
    ansible_user: devops
    ansible_ssh_private_key_file: /root/.ssh/id_ed25519_ansible
  children:
    platform:
      children:
        erp:
          hosts:
            erp-01:
              ansible_host: 192.168.10.244
        dify:
          hosts:
            dify-01:
              ansible_host: 192.168.10.245
        superset:
          hosts:
            superset-01:
              ansible_host: 192.168.10.246
        observability:
          hosts:
            obs-01:
              ansible_host: 192.168.10.247
        xwiki:
          hosts:
            xwiki-01:
              ansible_host: 192.168.10.248
