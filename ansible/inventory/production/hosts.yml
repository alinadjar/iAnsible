---
# Hosts are grouped by stack so each service can run on its own machine.
# Point ansible_host at the real IP/DNS and set ansible_user for SSH.

all:
  vars:
    ansible_user: devops
    ansible_ssh_private_key_file: /root/.ssh/id_ed25519_ansible
  children:
    platform:
      children:
        erp:
          hosts:
            erp-01:
              ansible_host: 192.168.10.159
        dify:
          hosts:
            dify-01:
              ansible_host: 192.168.10.159
        superset:
          hosts:
            superset-01:
              ansible_host: 192.168.10.159
        observability:
          hosts:
            obs-01:
              ansible_host: 192.168.10.159
        xwiki:
          hosts:
            xwiki-01:
              ansible_host: 192.168.10.159
