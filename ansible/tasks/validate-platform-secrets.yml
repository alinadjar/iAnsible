---
# Run after load-vault.yml when platform_vault_required_vars is set (e.g. deploy-erp).
- name: Require vault secrets to be present and not placeholders
  ansible.builtin.assert:
    that:
      - _hv[item] is defined
      - _hv[item] | string | length > 0
      - _hv[item] != 'CHANGE_ME'
    fail_msg: >-
      {% if (_hv[item] | default('')) == 'CHANGE_ME' %}
      {{ item }} is still the placeholder CHANGE_ME in secrets/vault.yml (decrypt succeeded).
      Set real values: ansible-vault edit {{ platform_secrets_file | default(playbook_dir ~ '/../secrets/vault.yml') }}
      {% elif _hv[item] is not defined %}
      {{ item }} is missing from secrets/vault.yml — compare keys with docs/vault.yml.example.
      {% else %}
      {{ item }} is empty.
      {% endif %}
    quiet: true
  vars:
    _hv: "{{ hostvars[inventory_hostname] }}"
  loop: "{{ platform_vault_required_vars | default([]) }}"
  when:
    - platform_secrets_required | default(true)
    - platform_vault_required_vars | default([]) | length > 0
