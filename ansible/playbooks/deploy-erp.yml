---
- name: Deploy Sadgan ERP stack
  hosts: erp
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: "{{ playbook_dir }}/../tasks/load-vault.yml"
    - ansible.builtin.import_tasks: "{{ playbook_dir }}/../tasks/validate-platform-secrets.yml"
  roles:
    - role: common
      tags: [common, bootstrap]
    - role: erp
      tags: [erp]
      when: erp_enabled | default(true)

