upstream frontend {
    server front:80;
}

upstream backend_api {
    server backend:8080;
}


server {
    listen 8001 ssl;
    server_name _;

    # SSL Configuration
    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;



    # 1. Reject if Host header is not one of our domains
    # if ($host !~ ^(holding\.erp\.sadgan\.int|api\.holding\.erp\.sadgan\.int)$) {
    #     return 444;   # connection closed without response (or 403)
    # }

    # 2. Reject if the request did NOT come from the trusted external proxy
    # Real client IP is the last one in X-Forwarded-For when proxy is trusted
    # Or use $remote_addr if you don't set X-Forwarded-For on the external proxy
    # if ($http_x_forwarded_for !~* $trusted_proxy) {
    #     return 403;
    # }

    # Optional extra safety: also check $remote_addr (direct connection to this nginx)
    # if ($remote_addr != $trusted_proxy) {
    #     return 403;
    # }
    location = /upgrading {
        proxy_pass http://sidecar:3000/upgrading?$query_string;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sdcr_assets/ {
        proxy_pass http://sidecar:3000/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /cors {
        proxy_pass http://sidecar:3000/cors;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /curl-status {
        proxy_pass http://sidecar:3000/curl-status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /install/report {
        proxy_pass http://sidecar:3000/install/report;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }


    location / {
            if (-f /etc/nginx/maintenance/.maintenance_enabled) {
                rewrite ^ /upgrading last;
            }

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }



server {
    listen 8000 ssl;
    server_name _;


    # SSL Configuration
    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;

    # if ($http_x_forwarded_for !~* $trusted_proxy) {
    #     return 403;
    # }

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 900s;
        client_max_body_size 20M;
        client_body_timeout 600s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

