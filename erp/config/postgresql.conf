postgresql.confdata_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'


listen_addresses = '*'
port = 5432
max_connections = 300



# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 300
log_min_messages = info
log_line_prefix = '%m [%p] %u@%d %r '



wal_level = replica
max_wal_senders = 10          # Number of concurrent replicas
wal_keep_size = 2GB           # Amount of WAL to keep for replica
max_replication_slots = 10
hot_standby = on

# Performance
shared_buffers = 512MB
effective_cache_size = 2GB
maintenance_work_mem = 128MB
work_mem = 8MB


track_io_timing = on
track_wal_io_timing = on
