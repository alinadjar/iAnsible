# TYPE  DATABASE    USER        ADDRESS         METHOD
local   all         all                         trust

# Allow specific users from any IP
host    all       readonly_user       0.0.0.0/0       md5
host    all       replica_user        0.0.0.0/0       md5
host    all       postgres            0.0.0.0/0       md5
# host    all       test_user           0.0.0.0/0       md5

# Or restrict to specific database(s)
# host    mydb        user1       0.0.0.0/0       md5

# Block all other users (this line must come AFTER allowed users)
host    all         all         0.0.0.0/0       reject

# Keep local/loopback access
host    all         all         127.0.0.1/32    md5
host    all         all         ::1/128         md5

# Replication entries (keep as needed)
host    replication replicator   all             md5
host    all         replicator   all             md5





