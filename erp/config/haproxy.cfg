global
    log stdout format raw local0 info
    maxconn 500000

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 10s
    timeout client 0
    timeout server 0
    timeout queue 30s
    timeout check 5s

# === Strongly recommended with timeout=0 ===
    # Or the more tunable version:
    # clitcpka-idle 60s      # start probing after 60s idle
    # clitcpka-intvl 30s     # probe every 30s
    # clitcpka-cnt 8         # 8 failed probes = close

    # srvtcpka-idle 60s
    # srvtcpka-intvl 30s
    # srvtcpka-cnt 8

# Keepalives - very important when timeouts are 0
    option clitcpka          # Enable client TCP keepalive
    option srvtcpka          # Enable server TCP keepalive
    option tcpka

# ============================================
# WRITE FRONTEND - Primary Server Only
# ============================================
frontend postgres_write_frontend
    bind :5432 name write
    mode tcp
    log global
    option tcplog
    default_backend postgres_write_backend
    # Optional: Rate limiting for writes
    # stick-table type ip size 1m expire 30s store conn_rate(3s)
    # tcp-request connection reject if { src_conn_rate gt 100 }

# Write Backend - Primary Only
backend postgres_write_backend
    mode tcp
    balance roundrobin
    default-server inter 10s fall 3 rise 2
    # Primary Server A
    server primary-a 192.168.10.244:5437 check port 5437 weight 1



# ============================================
# READ FRONTEND - Load Balance Across Replicas
# ============================================
frontend postgres_read_frontend
    bind :5433 name read
    mode tcp
    log global
    option tcplog
    default_backend postgres_read_backend

# Read Backend - Replicas Only (Round Robin)
backend postgres_read_backend
    mode tcp
    balance roundrobin
    default-server inter 10s fall 3 rise 2
    # Replica on Server B
    server replica-b 192.168.10.244:5417 check port 5417 weight 1
    # Replica on Server C (if exists)
    # server replica-c 192.168.10.100:5431 check port 5431 weight 1

# ============================================
# HEALTH CHECK DEPRECATED - Keep for reference
# ============================================
# The above uses PostgreSQL native health checks via httpchk
# Requires pg_healthcheck extension or separate monitoring

# Alternative: Use pure TCP health checks with custom check script
# backend postgres_read_backend
#     mode tcp
#     balance roundrobin
#     server replica-b 192.168.10.101:5431 check inter 5s fall 3 rise 2
#     server replica-c 192.168.10.102:5431 check inter 5s fall 3 rise 2

# ============================================
# STATISTICS PAGE
# ============================================
listen stats
    bind :8404 name stats
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin
    stats admin if TRUE
    stats refresh 10s
    log global
    option httplog
    timeout client 10s
    timeout connect 5s
    timeout server 10s

