  pg:
    image: nexus.sadgan.int/postgres:18.0
    user: "999:999"  # Force postgres user explicitly
    shm_size: '2gb'
    environment:
      POSTGRES_USER: ${PG_RW_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
        #PGDATA: /var/lib/postgresql/18/docker
    # labels:
    #   logging: "enabled"
    #   release: "alpha"
    #   proj: "FX"
    volumes:
      # Data persistence
      - postgres-data:/var/lib/postgresql/data
      # Monitoring exports
      - pg-csv-exports-alpha:/tmp/monitoring_exports
      # - pg_exports:/tmp/monitoring_exports
      # Mount configs to standard location (not versioned path)
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init:/docker-entrypoint-initdb.d
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - 5437:5432
    networks:
      - net_fx_alpha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_RW_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"


  nginx:
    image: nexus.sadgan.int/nginx:1.28.0
    restart: unless-stopped
    ports:
      - ${NGINX_PORT_FRONT}:8001
      - ${NGINX_PORT_BACK}:8000
    networks:
      - net_fx_alpha
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./config/maintenance:/etc/nginx/maintenance:ro
    logging:
      <<: *default-logging       
  

  mongo:
    image: mongo:8.3.2-noble
    container_name: mongo-alpha
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    command:
      - mongod
      - --auth
      - --bind_ip_all
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - 27019:27017
    healthcheck:
      test: >
        mongosh --quiet
        -u admin
        -p admin
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
      nproc:
        soft: 32000
        hard: 32000
    stop_grace_period: 60s
    networks:
      - net_fx_alpha
    logging:
      <<: *default-logging



  redis-alpha:
    image: registry.sadgan.int/common/redis-stack-server:latest
    container_name: redis-alpha
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6371:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    networks:
      - net_fx_alpha
      - redis_insight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"  



  haproxy:
    image: registry.sadgan.com/common/haproxy:2.8-alpine
    container_name: haproxy-postgres-lb
    restart: unless-stopped
    ports:
      - "5400:5432"      # Write port (Primary only)
      - "5401:5433"      # Read port (Round-robin replicas)
      - "8404:8404"      # Stats page
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy-errors:/usr/local/etc/haproxy/errors:ro
    networks:
      - net_fx_alpha
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-c"]
      interval: 30s
      timeout: 10s
      retries: 3



networks:
  net_fx_alpha:
    external: true
  redis_insight:
    external: true

volumes:
  redis-data:
  postgres-data:
  pg_exports:
  mongodb_data:
  mongodb_config:
  pg-csv-exports-alpha:
    external: true

