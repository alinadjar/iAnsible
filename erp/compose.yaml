  front:    
    image: ${REGISTRY_URL}/fx/front:${ERP_VERSION}
    env_file:
      - .env
    environment:
      <<: *default-environment
      TZ: Asia/Tehran  
    restart: unless-stopped
    # labels:
    #   logging: "true"  # Promtail will filter by this  
    networks:
      - net_fx_alpha
    volumes:
      - ./config/appsettings.front.json:/usr/share/nginx/html/appsettings.json    
    logging:
      <<: *default-logging
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3


