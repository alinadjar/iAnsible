# version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"

x-environment: &default-environment
  ASPNETCORE_ENVIRONMENT: Production

services:
  backend:
    image: ${REGISTRY_URL}/fx/backend:${ERP_VERSION}
    env_file:
      - .env
    labels:
      logging: "enabled"
      release: "alpha"
      proj: "FX"    
    environment:
      <<: *default-environment
      TZ: Asia/Tehran  
      App__DisableCors: false
      App__CorsOrigins: ${CorsOrigins}
      App__SelfUrl: ${SelfUrl}
      App__Version: ${ERP_VERSION}
      App__IsDeveloperMode: false
      Logging__LogLevel__Default: "Warning"
      Logging__LogLevel__Microsoft.AspNetCore.SignalR: "Warning"
      Logging__LogLevel__Microsoft.AspNetCore.Http.Connections: "Warning"
      Logging__LogLevel__Microsoft: "Warning"
      LiteTableSync__IsEnabled: true
      TaxPayer__IsEnabled: true
      License__LicenseServerUrl: ${LicenseServer}/api/licensemanagement/activation
      License__FingerprintAgentUrl: "http://192.168.10.244:4000"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}  
      App__UpdateServerUrl: "http://sidecar:3000/upgrade"
      Redis__Configuration: "redis-alpha"
      Redis__Port: 6379
      Redis__Password: "${REDIS_PASSWORD}"
      HelpDesk__BaseUrl: "https://dev.api.portal.sadgan.int/"
      HelpDesk__UserName: "rahbarian"
      HelpDesk__Password: "1q2w3E*"
      JWT__AccessTokenExpirationSeconds: 600
      JWT__RefreshTokenExpirationSeconds: 86400
      DocumentDbConnectionStrings__Default: 'mongodb://admin:admin@mongo:27017'
    command: >
      sh -c '
        sed -i "
          s|__PG_RW_HOST__|$PG_RW_HOST|g;
          s|__PG_RW_USER__|$PG_RW_USER|g;
          s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g;
          s|__PG_MaxPoolSize__|$PG_MaxPoolSize|g;
          s|__PG_RO_HOST__|$PG_RO_HOST|g;
          s|__PG_RO_PORT__|$PG_RO_PORT|g;
          s|__PG_RO_USER__|$PG_RO_USER|g;
          s|__POSTGRES_RO_PASSWORD__|$POSTGRES_RO_PASSWORD|g;
          s|__PG_MaxPoolSize_RO__|$PG_MaxPoolSize_RO|g;
          s|__REPLICA_IP_LB__|$REPLICA_IP_LB|g;
          s|__REPLICA_PORT_LB__|$REPLICA_PORT_LB|g;
          s|__PG_REPLICA_USER__|$PG_REPLICA_USER|g;
          s|__PG_REPLICA_PASSWORD__|$PG_REPLICA_PASSWORD|g;
          s|__PG_MaxPoolSize_REPLICA__|$PG_MaxPoolSize_REPLICA|g;
          s|__PG_BI_USER__|$PG_BI_USER|g;
          s|__POSTGRES_BI_PASSWORD__|$POSTGRES_BI_PASSWORD|g;
        " /app/appsettings.json &&
        exec dotnet SadganErp.Api.Gateway.HttpApi.Host.dll
      '
    # command: sh -c 'sed -i "s/__POSTGRES_PASSWORD__/$POSTGRES_PASSWORD/g; s/__POSTGRES_RO_PASSWORD__/$POSTGRES_RO_PASSWORD/g" /app/appsettings.json && dotnet SadganErp.Api.Gateway.HttpApi.Host.dll'
    volumes:
      - $PWD/metadata:/app/metadata
      - $PWD/backups:/app/backups  
    restart: unless-stopped
    networks:
      - net_fx_alpha
    depends_on:
      - pg
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.10.176:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "1"
        max-size: "5m"
        max-file: "1"
    
        #logging:
        #  <<: *default-logging
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 10s
